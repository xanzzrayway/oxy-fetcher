<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Ambient background: drifting signal blobs -->
    <div class="ambient-layer" aria-hidden="true">
        <div class="ambient-blob b1"></div>
        <div class="ambient-blob b2"></div>
        <div class="ambient-blob b3"></div>
    </div>

    <!-- Umpan Jebakan AdBlocker (Hidden Element) -->
    <div id="ad-banner-test" class="adsbox google-ad ad-placement sponsor-post" style="position: absolute; left: -9999px; top: -9999px; height: 10px; width: 10px;"></div>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">
        
        <!-- Input Section -->
        <section class="reveal reveal-1 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <form id="fetchForm" class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fa-solid fa-globe"></i>
                    </span>
                    <input 
                        type="text" 
                        id="targetUrl" 
                        required
                        placeholder="Masukkan URL website..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                    >
                </div>
                <button 
                    type="submit" 
                    id="btnSubmit"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/25 disabled:opacity-70 disabled:cursor-not-allowed"
                >
                    <span class="scan-sweep" aria-hidden="true"></span>
                    <i class="fa-solid fa-cloud-arrow-down" id="btnIcon"></i>
                    <span id="btnText">Ambil HTML</span>
                </button>
            </form>

            <!-- AdBlocker Detection Small UI -->
            <div id="adblockWarning" class="hidden mt-3 flex items-center gap-2 text-rose-500 bg-rose-950/30 border border-rose-600/50 px-3 py-1.5 rounded-lg w-fit text-xs font-semibold tracking-wide">
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm"></i>
                <span>AD-BLOCKER DETECT</span>
            </div>
        </section>

        <!-- Opsi Section -->
        <section id="optionCard" class="reveal reveal-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <h3 class="text-xs font-semibold text-slate-400">Tambahkan Ke Fetcher</h3>

            <label for="bundleAssets" class="flex items-center justify-between cursor-pointer select-none">
                <span id="bundleLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300">Bundle CSS &amp; JS</span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="bundleAssets" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>

            <label for="optFullJs" class="flex items-center justify-between cursor-pointer select-none opt-row">
                <span class="min-w-0">
                    <span id="optFullJsLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300 block">Ambil JS Lengkap</span>
                    <span class="text-[11px] text-slate-500 block">Susurin chunk turunan (dynamic import) rekursif, bukan cuma yang keliatan di HTML awal</span>
                </span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="optFullJs" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>

            <label for="optNextjs" class="flex items-center justify-between cursor-pointer select-none opt-row">
                <span class="min-w-0">
                    <span id="optNextjsLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300 block">Bundle Next.js</span>
                    <span class="text-[11px] text-slate-500 block">Tarik chunk dari modulepreload, preload as=script, & RSC payload (self.__next_f)</span>
                </span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="optNextjs" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>

            <label for="optDecryptJs" class="flex items-center justify-between cursor-pointer select-none opt-row">
                <span class="min-w-0">
                    <span id="optDecryptJsLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300 block">Auto Decrypte File JS Atau Lainnya</span>
                    <span class="text-[11px] text-slate-500 block">Bongkar file JS yang dibungkus eval-packer (p,a,c,k,e,d) jadi kode asli</span>
                </span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="optDecryptJs" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>

            <label for="optDecryptAll" class="flex items-center justify-between cursor-pointer select-none opt-row">
                <span class="min-w-0">
                    <span id="optDecryptAllLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300 block">Auto Decrypte Semua File Yang Di-Encrypt</span>
                    <span class="text-[11px] text-slate-500 block">Sama kayak di atas tapi disapu ke semua asset (CSS/JS) yang ke-bundle, gak cuma satu file</span>
                </span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="optDecryptAll" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>

            <label for="optUnminify" class="flex items-center justify-between cursor-pointer select-none opt-row">
                <span class="min-w-0">
                    <span id="optUnminifyLabel" class="text-sm font-medium text-slate-200 transition-colors duration-300 block">Auto Unminify JS</span>
                    <span class="text-[11px] text-slate-500 block">Rapihin ulang JS yang di-minify (via js-beautify) biar gampang dibaca</span>
                </span>
                <span class="toggle-switch shrink-0">
                    <input type="checkbox" id="optUnminify" class="sr-only">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </span>
            </label>
        </section>

        <!-- Process Log Panel -->
        <section id="logSection" class="reveal reveal-3 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <button type="button" onclick="toggleLogPanel()" class="w-full flex items-center justify-between px-4 py-3 hover:bg-slate-800/40 transition-all">
                <span class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <i class="fa-solid fa-terminal text-indigo-400"></i>
                    Log Proses
                    <span id="logCountBadge" class="hidden bg-indigo-600/20 text-indigo-300 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                </span>
                <i id="logChevron" class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform"></i>
            </button>
            <div id="logBody" class="border-t border-slate-800">
                <div class="flex items-center justify-end gap-2 px-3 py-2 bg-slate-950/60 border-b border-slate-800/60">
                    <button type="button" onclick="clearLog()" class="text-[11px] text-slate-500 hover:text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> Bersihkan
                    </button>
                </div>
                <div id="logOutput" class="bg-slate-950 max-h-64 overflow-y-auto px-4 py-3 font-mono text-[11px] leading-relaxed">
                    <p class="text-slate-600 italic">Belum ada proses. Log akan muncul di sini saat kamu klik "Ambil HTML".</p>
                </div>
            </div>
        </section>

        <!-- Output Section -->
        <section id="outputSection" class="hidden w-full flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="flex items-center justify-between px-4 pt-4">
                <h3 class="text-xs font-semibold text-slate-400">Riwayat Fetcher</h3>
                <button
                    id="btnClearHistory"
                    onclick="clearHistory()"
                    class="text-[11px] text-slate-500 hover:text-rose-400 flex items-center gap-1.5 transition-colors"
                >
                    <i class="fa-solid fa-trash-can text-[10px]"></i> Bersihkan
                </button>
            </div>

            <!-- List riwayat, di-render dinamis dari localStorage -->
            <div id="historyList" class="flex flex-col gap-3 p-4 pt-3"></div>
        </section>

        <!-- Dropdown menu aksi per item riwayat (dipakai bareng, portal ke body) -->
        <div id="fileMenu" class="hidden fixed w-36 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden z-50">
            <button type="button" onclick="menuAction('preview')" class="w-full text-left px-3.5 py-2.5 text-xs text-slate-300 hover:bg-slate-800 flex items-center gap-2">
                <i id="previewMenuIcon" class="fa-solid fa-eye text-slate-500 w-3.5"></i> <span id="previewMenuLabel">Preview</span>
            </button>
            <button type="button" onclick="menuAction('copy')" class="w-full text-left px-3.5 py-2.5 text-xs text-slate-300 hover:bg-slate-800 flex items-center gap-2 border-t border-slate-800">
                <i class="fa-regular fa-copy text-slate-500 w-3.5"></i> Copy
            </button>
            <button type="button" onclick="menuAction('delete')" class="w-full text-left px-3.5 py-2.5 text-xs text-rose-400 hover:bg-slate-800 flex items-center gap-2 border-t border-slate-800">
                <i class="fa-solid fa-trash-can text-rose-500/70 w-3.5"></i> Hapus
            </button>
        </div>


        <!-- Welcome Placeholder -->
        <section id="welcomePlaceholder" class="reveal reveal-4 flex-1 min-h-[350px] border border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center text-center p-6">
            <div class="radar-icon-wrap w-16 h-16 mb-4">
                <span class="radar-ring"></span>
                <span class="radar-ring r2"></span>
                <span class="radar-ring r3"></span>
                <div class="globe-float bg-slate-900 w-16 h-16 rounded-2xl flex items-center justify-center border border-slate-800 shadow-inner relative">
                    <i class="fa-solid fa-globe text-2xl text-slate-500"></i>
                </div>
            </div>
            <h3 class="text-base font-semibold text-slate-300">Blom Ada Website yg Dimuat</h3>
            <p class="text-xs text-slate-500 max-w-sm mt-1">Masukkan link URL di atas lalu klik tombol "Ambil HTML" buat ngebongkar strukturnya.</p>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 z-50">
        <div id="toastIcon" class="w-8 h-8 rounded-lg flex items-center justify-center text-white"></div>
        <div class="text-xs">
            <p id="toastTitle" class="font-bold text-slate-200"></p>
            <p id="toastDesc" class="text-slate-400"></p>
        </div>
    </div>

    <!-- PrismJS Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="script.js"></script>
</body>
</html>
